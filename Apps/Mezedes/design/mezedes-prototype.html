  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;mezedes-prototype&#x27;);
      const collectionPage = root.querySelector(&#x27;#mz-collection-page&#x27;);
      const detailPage = root.querySelector(&#x27;#mz-detail-page&#x27;);
      const crumb = root.querySelector(&#x27;.mz-crumb&#x27;);
      const headerName = root.querySelector(&#x27;#mz-header-name&#x27;);
      const previewPane = root.querySelector(&#x27;#mz-preview-pane&#x27;);
      const codePane = root.querySelector(&#x27;#mz-code-pane&#x27;);
      const versionSheet = root.querySelector(&#x27;#mz-version-sheet&#x27;);
      const backdrop = root.querySelector(&#x27;#mz-backdrop&#x27;);
      const versionButton = root.querySelector(&#x27;#mz-version-button&#x27;);
      const settingsDialog = root.querySelector(&#x27;#mz-settings-dialog&#x27;);
      const deleteDialog = root.querySelector(&#x27;#mz-delete-dialog&#x27;);
      const liveView = root.querySelector(&#x27;#mz-live-view&#x27;);
      const toast = root.querySelector(&#x27;#mz-toast&#x27;);
      const accountMenu = root.querySelector(&#x27;#mz-account-menu&#x27;);
      const overflowMenu = root.querySelector(&#x27;#mz-overflow-menu&#x27;);
      const nameInput = root.querySelector(&#x27;#mz-name&#x27;);
      const deleteName = root.querySelector(&#x27;#mz-delete-name&#x27;);
      const deleteInput = root.querySelector(&#x27;#mz-delete-confirm&#x27;);
      const deleteButton = root.querySelector(&#x27;#mz-confirm-delete&#x27;);
      const grid = root.querySelector(&#x27;#mz-grid&#x27;);
      const count = root.querySelector(&#x27;#mz-count&#x27;);
      const codeTarget = root.querySelector(&#x27;#mz-code code&#x27;);
      let currentName = &#x27;signal garden&#x27;;
      let currentVersion = &#x27;Live&#x27;;
      let toastTimer;

      const codeFiles = {
        &#x27;App.tsx&#x27;: `&lt;span class=&quot;tk-o&quot;&gt;import&lt;/span&gt; { SignalGarden } &lt;span class=&quot;tk-o&quot;&gt;from&lt;/span&gt; &lt;span class=&quot;tk-y&quot;&gt;&#x27;./garden&#x27;&lt;/span&gt;;

&lt;span class=&quot;tk-o&quot;&gt;export default function&lt;/span&gt; App() {
  &lt;span class=&quot;tk-o&quot;&gt;return&lt;/span&gt; &amp;lt;SignalGarden density={&lt;span class=&quot;tk-y&quot;&gt;18&lt;/span&gt;} /&amp;gt;;
}`,
        &#x27;garden.ts&#x27;: `&lt;span class=&quot;tk-o&quot;&gt;export function&lt;/span&gt; &lt;span class=&quot;tk-g&quot;&gt;sendSignal&lt;/span&gt;(x: number, y: number) {
  &lt;span class=&quot;tk-o&quot;&gt;return&lt;/span&gt; { origin: [x, y], rings: &lt;span class=&quot;tk-y&quot;&gt;3&lt;/span&gt; };
}

&lt;span class=&quot;tk-o&quot;&gt;export const&lt;/span&gt; palette = {
  cobalt: &lt;span class=&quot;tk-y&quot;&gt;&#x27;#174e91&#x27;&lt;/span&gt;,
  olive: &lt;span class=&quot;tk-y&quot;&gt;&#x27;#65704c&#x27;&lt;/span&gt;,
  sun: &lt;span class=&quot;tk-y&quot;&gt;&#x27;#d8512d&#x27;&lt;/span&gt;
};`,
        &#x27;styles.css&#x27;: `.garden { background: &lt;span class=&quot;tk-y&quot;&gt;#f3eddd&lt;/span&gt;; }
.signal { stroke: &lt;span class=&quot;tk-y&quot;&gt;#d8512d&lt;/span&gt;; }
.stem { stroke: &lt;span class=&quot;tk-y&quot;&gt;#65704c&lt;/span&gt;; }`,
        &#x27;index.html&#x27;: `&amp;lt;main id=&lt;span class=&quot;tk-y&quot;&gt;&quot;garden&quot;&lt;/span&gt;&amp;gt;&amp;lt;/main&amp;gt;
&amp;lt;script type=&lt;span class=&quot;tk-y&quot;&gt;&quot;module&quot;&lt;/span&gt; src=&lt;span class=&quot;tk-y&quot;&gt;&quot;/src/App.tsx&quot;&lt;/span&gt;&amp;gt;&amp;lt;/script&amp;gt;`,
        &#x27;package.json&#x27;: `{
  &lt;span class=&quot;tk-y&quot;&gt;&quot;name&quot;&lt;/span&gt;: &lt;span class=&quot;tk-y&quot;&gt;&quot;signal-garden&quot;&lt;/span&gt;,
  &lt;span class=&quot;tk-y&quot;&gt;&quot;private&quot;&lt;/span&gt;: true,
  &lt;span class=&quot;tk-y&quot;&gt;&quot;dependencies&quot;&lt;/span&gt;: { &lt;span class=&quot;tk-y&quot;&gt;&quot;react&quot;&lt;/span&gt;: &lt;span class=&quot;tk-y&quot;&gt;&quot;19.1.0&quot;&lt;/span&gt; }
}`
      };

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add(&#x27;is-open&#x27;);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-open&#x27;), 2200);
      }

      function closeMenus() {
        accountMenu.hidden = true;
        overflowMenu.hidden = true;
        root.querySelector(&#x27;[data-action=&quot;account&quot;]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        root.querySelector(&#x27;[data-action=&quot;overflow&quot;]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      }

      function goHome() {
        root.dataset.route = &#x27;collection&#x27;;
        collectionPage.hidden = false;
        detailPage.hidden = true;
        crumb.hidden = true;
        closeSheet();
        closeMenus();
      }

      function openMezes(name) {
        currentName = name;
        root.dataset.route = &#x27;detail&#x27;;
        collectionPage.hidden = true;
        detailPage.hidden = false;
        crumb.hidden = false;
        headerName.textContent = name;
        nameInput.value = name;
        deleteName.textContent = name;
        setView(&#x27;preview&#x27;);
        requestAnimationFrame(() =&gt; drawGarden(root.querySelector(&#x27;#mz-garden&#x27;), currentVersion));
      }

      function setView(view) {
        const preview = view === &#x27;preview&#x27;;
        previewPane.hidden = !preview;
        codePane.hidden = preview;
        root.querySelectorAll(&#x27;.mz-mode&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-selected&#x27;, String(button.dataset.view === view)));
        if (!preview) codeTarget.innerHTML = codeFiles[&#x27;App.tsx&#x27;];
      }

      function openSheet() {
        versionSheet.classList.add(&#x27;is-open&#x27;);
        backdrop.classList.add(&#x27;is-open&#x27;);
        versionSheet.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
        root.querySelector(&#x27;[data-action=&quot;versions&quot;]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      }

      function closeSheet() {

      function selectVersion(version) {

        root.querySelectorAll(&#x27;.mz-version&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-current&#x27;, String(button.dataset.version === version)));
        versionButton.textContent = version === &#x27;Live&#x27; ? &#x27;versions&#x27; : `versions · ${version}`;
        drawGarden(root.querySelector(&#x27;#mz-garden&#x27;), version);
        closeSheet();
        showToast(version === &#x27;Live&#x27; ? &#x27;Showing live&#x27; : `Showing frozen ${version}`);
      }

      function toggleTheme() {
        const dark = root.dataset.theme === &#x27;dark&#x27;;
        root.dataset.theme = dark ? &#x27;light&#x27; : &#x27;dark&#x27;;
        const themeButton = root.querySelector(&#x27;.mz-header [data-action=&quot;theme&quot;]&#x27;);
        themeButton.querySelector(&#x27;.mz-symbol&#x27;).textContent = dark ? &#x27;☼&#x27; : &#x27;◐&#x27;;
        themeButton.querySelector(&#x27;.mz-label&#x27;).textContent = dark ? &#x27;daylight&#x27; : &#x27;olive dusk&#x27;;

        if (!liveView.hidden) drawGarden(root.querySelector(&#x27;#mz-live-garden&#x27;), currentVersion);
        closeMenus();
      }

      function openSettings() {
        closeMenus();
        nameInput.value = currentName;
        settingsDialog.showModal();
      }

      function saveSettings() {
        const nextName = nameInput.value.trim() || currentName;
        const privacy = root.querySelector(&#x27;input[name=&quot;privacy&quot;]:checked&#x27;).value;
        const oldName = currentName;
        currentName = nextName;
        headerName.textContent = nextName;
        deleteName.textContent = nextName;
        const matchingCard = [...grid.querySelectorAll(&#x27;.mz-mezes&#x27;)].find(card =&gt; card.dataset.mezes === oldName);
        if (matchingCard) {
          matchingCard.dataset.mezes = nextName;
          matchingCard.querySelector(&#x27;.mz-mezes-title&#x27;).innerHTML = nextName.split(&#x27; &#x27;).join(&#x27;&lt;br&gt;&#x27;);
          const meta = matchingCard.querySelector(&#x27;.mz-meta&#x27;);
          meta.textContent = `${privacy === &#x27;public&#x27; ? &#x27;public&#x27; : &#x27;private&#x27;} · 4 versions · now`;
        }
        settingsDialog.close();
        showToast(&#x27;Changes saved&#x27;);
      }

      function openDelete() {
        settingsDialog.close();
        deleteInput.value = &#x27;&#x27;;
        deleteButton.disabled = true;
        deleteDialog.showModal();
      }

      function confirmDelete() {
        const card = [...grid.querySelectorAll(&#x27;.mz-mezes&#x27;)].find(item =&gt; item.dataset.mezes === currentName);
        if (card) card.remove();
        count.textContent = `${grid.querySelectorAll(&#x27;.mz-mezes&#x27;).length} mezedes`;
        deleteDialog.close();
        goHome();
        showToast(&#x27;Mezes deleted&#x27;);
      }

      function openLive() {
        liveView.hidden = false;
        drawGarden(root.querySelector(&#x27;#mz-live-garden&#x27;), currentVersion);
      }

      function drawGarden(canvas, version) {
        if (!canvas || canvas.offsetWidth === 0) return;
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width * ratio));
        canvas.height = Math.max(1, Math.round(rect.height * ratio));

        ctx.scale(ratio, ratio);
        const w = rect.width;
        const h = rect.height;
        const dark = root.dataset.theme === &#x27;dark&#x27;;
        const paper = dark ? &#x27;#111711&#x27; : &#x27;#fffaf0&#x27;;
        const cobalt = dark ? &#x27;#a6ba75&#x27; : &#x27;#174e91&#x27;;
        const olive = dark ? &#x27;#8fa269&#x27; : &#x27;#65704c&#x27;;
        const accent = dark ? &#x27;#d6a846&#x27; : &#x27;#d8512d&#x27;;
        const seedBase = {Live: 41, v4: 35, v3: 29, v2: 23, v1: 17}[version] || 41;
        let seed = seedBase;
        const random = () =&gt; { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        ctx.fillStyle = paper;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = cobalt;
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.55;
        for (let wave = 0; wave &lt; 9; wave++) {
          ctx.beginPath();
          for (let x = -20; x &lt;= w + 20; x += 7) {
            const y = h * 0.64 + wave * 8 + Math.sin(x * 0.018 + wave * 0.55) * 14;
            if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        const stems = Math.max(16, Math.floor(w / 44));
        for (let i = 0; i &lt; stems; i++) {
          const x = 18 + random() * (w - 36);
          const stemH = h * (0.2 + random() * 0.42);
          const base = h - 18;
          const bend = (random() - 0.5) * 34;
          ctx.strokeStyle = olive;
          ctx.lineWidth = 1 + random() * 0.6;
          ctx.beginPath();
          ctx.moveTo(x, base);
          ctx.quadraticCurveTo(x + bend * 0.4, base - stemH * 0.55, x + bend, base - stemH);
          ctx.stroke();
          const leaves = 3 + Math.floor(random() * 5);
          for (let leaf = 1; leaf &lt;= leaves; leaf++) {
            const t = leaf / (leaves + 1);
            const lx = x + bend * t;
            const ly = base - stemH * t;
            const side = leaf % 2 ? -1 : 1;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.quadraticCurveTo(lx + side * 14, ly - 10, lx + side * 19, ly - 3);
            ctx.quadraticCurveTo(lx + side * 9, ly + 3, lx, ly);
            ctx.stroke();
          }
          if (random() &gt; 0.36) {
            ctx.fillStyle = random() &gt; 0.7 ? accent : olive;
            ctx.beginPath();
            ctx.arc(x + bend, base - stemH, 2.5 + random() * 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = accent;
        for (let i = 0; i &lt; 13; i++) {
          const x = random() * w;
          const y = 35 + random() * h * 0.4;
          ctx.fillRect(x, y, 2, 2);
        }
        canvas.dataset.drawn = &#x27;true&#x27;;
      }

      function sendSignal(event) {
        const canvas = event.currentTarget;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const ctx = canvas.getContext(&#x27;2d&#x27;);
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        ctx.save();
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = root.dataset.theme === &#x27;dark&#x27; ? &#x27;#d6a846&#x27; : &#x27;#d8512d&#x27;;
        ctx.lineWidth = 1.5;
        [12, 28, 46].forEach(radius =&gt; { ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.stroke(); });
        ctx.restore();
      }

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const mezes = event.target.closest(&#x27;[data-mezes]&#x27;);
        if (mezes) { openMezes(mezes.dataset.mezes); return; }
        const view = event.target.closest(&#x27;[data-view]&#x27;);
        if (view) { setView(view.dataset.view); return; }
        const version = event.target.closest(&#x27;[data-version]&#x27;);
        if (version) { selectVersion(version.dataset.version); return; }
        const action = event.target.closest(&#x27;[data-action]&#x27;)?.dataset.action;
        if (!action) return;
        if (action === &#x27;home&#x27;) goHome();
        if (action === &#x27;theme&#x27;) toggleTheme();
        if (action === &#x27;account&#x27;) { const open = accountMenu.hidden; closeMenus(); accountMenu.hidden = !open; event.target.closest(&#x27;button&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(open)); }
        if (action === &#x27;overflow&#x27;) { const open = overflowMenu.hidden; closeMenus(); overflowMenu.hidden = !open; event.target.closest(&#x27;button&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(open)); }
        if (action === &#x27;versions&#x27;) openSheet();
        if (action === &#x27;close-sheet&#x27;) closeSheet();
        if (action === &#x27;settings&#x27;) openSettings();
        if (action === &#x27;save-settings&#x27;) saveSettings();
        if (action === &#x27;close-settings&#x27;) settingsDialog.close();
        if (action === &#x27;delete&#x27;) openDelete();
        if (action === &#x27;confirm-delete&#x27;) confirmDelete();
        if (action === &#x27;close-delete&#x27;) deleteDialog.close();
        if (action === &#x27;open-live&#x27;) openLive();
        if (action === &#x27;close-live&#x27;) liveView.hidden = true;
        if (action === &#x27;signout&#x27;) { closeMenus(); showToast(&#x27;Signed out in the real product&#x27;); }
      });

      deleteInput.addEventListener(&#x27;input&#x27;, () =&gt; { deleteButton.disabled = deleteInput.value !== currentName; });
      root.querySelectorAll(&#x27;[data-file]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;[data-file]&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-current&#x27;, String(item === button)));
        codeTarget.innerHTML = codeFiles[button.dataset.file];
      }));
      root.querySelector(&#x27;#mz-garden&#x27;).addEventListener(&#x27;click&#x27;, sendSignal);
      root.querySelector(&#x27;#mz-live-garden&#x27;).addEventListener(&#x27;click&#x27;, sendSignal);
      window.addEventListener(&#x27;resize&#x27;, () =&gt; {
        if (root.dataset.route === &#x27;detail&#x27; &amp;&amp; !previewPane.hidden) drawGarden(root.querySelector(&#x27;#mz-garden&#x27;), currentVersion);
        if (!liveView.hidden) drawGarden(root.querySelector(&#x27;#mz-live-garden&#x27;), currentVersion);
      });

      codeTarget.innerHTML = codeFiles[&#x27;App.tsx&#x27;];
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

name: prod

# TAGS, not main. Staging moves on every merge; production moves when a release
# is cut, which is what `release.yml` produces.
on:
  push:
    tags: ["v*"]

concurrency:
  group: prod
  # NOT cancel-in-progress: a half-applied production deploy is worse than a
  # queued one.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The repository's `production` environment. Whatever reviewers or wait
    # timer it carries gate this job.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/alchemy
        with:
          command: deploy
          stage: production

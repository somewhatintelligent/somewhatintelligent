name: sweep

# THE LEAK CATCHER. `preview.yml` tears a stage down when its PR closes, which
# covers every case except the ones that matter: a teardown that failed, a PR
# closed while the runner was down, a stage deployed by hand and forgotten.
# Weekly, this destroys every `pr_<n>` stage whose pull request is no longer
# open.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: destroy stages whose pull request is closed
        shell: bash
        run: |
          set -euo pipefail

          # `alchemy state stages` needs the STACK NAME, which is the string
          # each `Alchemy.Stack(...)` is constructed with — not the directory.
          # Listed in destroy order (the reverse of the deploy order in
          # `.github/actions/alchemy`), so auth goes last.
          ENTRIES=(
            "apps/platform.inbox:AgenticInbox"
            "apps/mezedes:Mezedes"
            "apps/platform.site:PlatformCommerce"
            "apps/platform.auth:SomewhatIntelligentAuth"
          )

          # Collect the doomed stages FIRST, across every stack, then destroy
          # each in dependency order. Destroying per-stack as we discover would
          # tear auth down before the stacks that reference it.
          declare -A DOOMED=()
          for entry in "${ENTRIES[@]}"; do
            app="${entry%%:*}"
            stack="${entry##*:}"
            # `state stages` prints one stage per line, or "(no stages in X)".
            # It has no --json flag, so this is the parse.
            stages="$(bunx alchemy state stages "$app/alchemy.run.ts" --stack "$stack" 2>/dev/null \
              | grep -E '^pr_[0-9]+$' || true)"
            for stage in $stages; do
              number="${stage#pr_}"
              state="$(gh pr view "$number" --json state -q .state 2>/dev/null || echo UNKNOWN)"
              # UNKNOWN means the PR could not be read at all — a deleted or
              # never-existent number. Sweeping it is right; leaving it is the
              # leak this job exists for.
              if [ "$state" != "OPEN" ]; then
                DOOMED["$stage"]=1
                echo "pr_$number is $state — queued for destroy"
              fi
            done
          done

          if [ ${#DOOMED[@]} -eq 0 ]; then
            echo "nothing to sweep"
            exit 0
          fi

          for stage in "${!DOOMED[@]}"; do
            for entry in "${ENTRIES[@]}"; do
              app="${entry%%:*}"
              echo "::group::destroy $app @ $stage"
              # `|| true`: a stack that was never deployed to this stage has no
              # state to destroy, and one stack failing must not strand the
              # rest of the sweep.
              bunx alchemy destroy "$app/alchemy.run.ts" --stage "$stage" --yes || true
              echo "::endgroup::"
            done
          done

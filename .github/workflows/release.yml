name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The default `GITHUB_TOKEN`. It cannot fire another workflow with the
          # tag it pushes — which is exactly why `prod.yml` is CALLED below
          # rather than triggered by that tag. See the note in that file.

  # Merging the release PR is what deploys production: this run cuts the tag and
  # then deploys, in one place, so the release and the deploy cannot disagree
  # about which commit shipped.
  prod:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/prod.yml
    secrets: inherit

name: alchemy
description: Deploy or destroy every app stack for one stage, in dependency order.

inputs:
  command:
    description: deploy | destroy
    required: true
  stage:
    description: The stage to act on, e.g. production, staging, pr_41
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - shell: bash
      run: bun install --frozen-lockfile

    # THE ORDER IS A DEPENDENCY ORDER, not a preference.
    #
    # `platform.auth` declares the stage's shared Access application and every
    # other stack reads its `aud` out of auth's persisted outputs — so auth
    # deploys first or the rest die with "the auth stack exported an empty
    # POLICY_AUD". `platform.site` deploys the commerce substrate in the same
    # stack; mezedes reads auth too.
    #
    # Destroy reverses it: tearing auth down first would strand the others'
    # reference to a stack that no longer has state.
    - shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail

        case "$COMMAND" in
          deploy|destroy) ;;
          *) echo "::error::command must be deploy or destroy, got '$COMMAND'"; exit 1 ;;
        esac

        ORDER=(apps/platform.auth apps/platform.site apps/mezedes)

        # THE INBOX IS PRODUCTION-ONLY, and deliberately not a preview surface.
        #
        # It is an inbox: what makes it worth opening is the mail in it, and
        # mail arrives through zone-level Email Routing, which has ONE owner.
        # A preview copy receives nothing, so it would be an empty shell that
        # still costs an R2 bucket, an AI gateway and a Durable Object
        # namespace per pull request.
        if [ "$STAGE" = "production" ]; then
          ORDER+=(apps/platform.inbox)
        fi

        if [ "$COMMAND" = "destroy" ]; then
          REVERSED=()
          for ((i = ${#ORDER[@]} - 1; i >= 0; i--)); do REVERSED+=("${ORDER[i]}"); done
          ORDER=("${REVERSED[@]}")
        fi

        for app in "${ORDER[@]}"; do
          # BUILD FIRST, IF THE APP HAS ONE TO RUN.
          #
          # Most apps here are `Website.Vite` or `Website.Astro`, and alchemy
          # runs their build itself as part of the deploy. Mezedes is not: it is
          # a raw `Cloudflare.Worker` whose `assets.directory` points at a
          # `dist/shell` that `vite build` produces, so alchemy expects the
          # directory to already exist and dies with `NotFound:
          # FileSystem.readDirectory` when it does not. On a developer's machine
          # it is there from the last local build; on a fresh runner it never is.
          #
          # Keyed off the script rather than naming mezedes, so the next app to
          # need a prebuilt artifact gets one without editing this file.
          if [ "$COMMAND" = "deploy" ] &&
             node -e "process.exit(require('./$app/package.json').scripts?.build ? 0 : 1)"; then
            echo "::group::build $app"
            bun run --cwd "$app" build
            echo "::endgroup::"
          fi

          echo "::group::$COMMAND $app @ $STAGE"
          bunx alchemy "$COMMAND" "$app/alchemy.run.ts" --stage "$STAGE" --yes
          echo "::endgroup::"
        done

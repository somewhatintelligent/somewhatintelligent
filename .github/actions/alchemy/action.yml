name: alchemy
description: Deploy or destroy every app stack for one stage, in dependency order.

inputs:
  command:
    description: deploy | destroy
    required: true
  stage:
    description: The stage to act on, e.g. production, staging, pr_41
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    # Without this, every preview push, teardown, trunk merge and prod deploy
    # resolves a ~2400-entry lockfile from the network cold — ~30-60s a run.
    # Keyed on the lockfile alone: a hit means every package is already local.
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - shell: bash
      run: bun install --frozen-lockfile

    # THE ORDER IS A DEPENDENCY ORDER, not a preference.
    #
    # `platform.auth` declares the stage's shared Access application and every
    # other stack reads its `aud` out of auth's persisted outputs — so auth
    # deploys first or the rest die with "the auth stack exported an empty
    # POLICY_AUD". `platform.site` deploys the commerce substrate in the same
    # stack; mezedes reads auth too.
    #
    # Destroy reverses it: tearing auth down first would strand the others'
    # reference to a stack that no longer has state.
    - shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail

        case "$COMMAND" in
          deploy|destroy) ;;
          *) echo "::error::command must be deploy or destroy, got '$COMMAND'"; exit 1 ;;
        esac

        # THE SECRETS ARE ENCRYPTED AT REST AND SOMETHING HAS TO DECRYPT THEM.
        #
        # `.env.production` and `.env.development` hold dotenvx ciphertext —
        # `STRIPE_SECRET_KEY="encrypted:BCLOY…"`. Bun loads whichever file
        # matches `NODE_ENV` all by itself, which is what made this look wired
        # up, but it has no idea what dotenvx is: it puts the CIPHERTEXT in the
        # environment verbatim. `Config.redacted("STRIPE_SECRET_KEY")` then
        # resolves a perfectly good string that is not a key.
        #
        # It failed closed on production and NOWHERE ELSE, which is why it took
        # a release to find. `livemode` is derived from an `sk_live_` prefix, so
        # ciphertext reads as test-mode: production refused the deploy with
        # `StripeKeyMismatch`, and every preview and staging deploy before it
        # went green while binding ciphertext to its workers as a secret.
        #
        # `dotenvx run` is what actually decrypts, using the private key named
        # after the FILE — `DOTENV_PRIVATE_KEY_PRODUCTION` for
        # `.env.production`. It injects before spawning, and values already in
        # the environment win over the ones bun loads afterwards, so the
        # plaintext survives bun re-reading the same file.
        #
        # The file is chosen by stage rather than by `NODE_ENV`: production is
        # the only stage that talks to the live Stripe account, and every other
        # stage — staging, a pull request, a `dev_` stage run by hand — shares
        # the sandbox one.
        if [ "$STAGE" = "production" ]; then
          ENV_FILE=.env.production
        else
          ENV_FILE=.env.development
        fi
        echo "decrypting $ENV_FILE for stage $STAGE"

        ORDER=(apps/platform.auth apps/platform.site apps/mezedes)

        # THE INBOX IS PRODUCTION-ONLY, and deliberately not a preview surface.
        #
        # It is an inbox: what makes it worth opening is the mail in it, and
        # mail arrives through zone-level Email Routing, which has ONE owner.
        # A preview copy receives nothing, so it would be an empty shell that
        # still costs an R2 bucket, an AI gateway and a Durable Object
        # namespace per pull request.
        if [ "$STAGE" = "production" ]; then
          ORDER+=(apps/platform.inbox)
        fi

        if [ "$COMMAND" = "destroy" ]; then
          REVERSED=()
          for ((i = ${#ORDER[@]} - 1; i >= 0; i--)); do REVERSED+=("${ORDER[i]}"); done
          ORDER=("${REVERSED[@]}")
        fi

        for app in "${ORDER[@]}"; do
          # BUILD FIRST, IF THE APP HAS ONE TO RUN.
          #
          # Most apps here are `Website.Vite` or `Website.Astro`, and alchemy
          # runs their build itself as part of the deploy. Mezedes is not: it is
          # a raw `Cloudflare.Worker` whose `assets.directory` points at a
          # `dist/shell` that `vite build` produces, so alchemy expects the
          # directory to already exist and dies with `NotFound:
          # FileSystem.readDirectory` when it does not. On a developer's machine
          # it is there from the last local build; on a fresh runner it never is.
          #
          # Keyed off the script rather than naming mezedes, so the next app to
          # need a prebuilt artifact gets one without editing this file.
          # The build is wrapped too: a client bundle can bake in a publishable
          # key, and reading `encrypted:…` there fails at a customer's browser
          # rather than at the deploy.
          if [ "$COMMAND" = "deploy" ] &&
             node -e "process.exit(require('./$app/package.json').scripts?.build ? 0 : 1)"; then
            echo "::group::build $app"
            bunx dotenvx run -f "$ENV_FILE" -- bun run --cwd "$app" build
            echo "::endgroup::"
          fi

          echo "::group::$COMMAND $app @ $STAGE"
          bunx dotenvx run -f "$ENV_FILE" -- bunx alchemy "$COMMAND" "$app/alchemy.run.ts" --stage "$STAGE" --yes
          echo "::endgroup::"
        done

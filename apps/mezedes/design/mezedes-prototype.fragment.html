          <div class="mz-overflow-wrap">
            <button type="button" class="mz-icon-action" data-action="overflow" aria-label="More mezes actions" aria-expanded="false">•••</button>
            <div class="mz-popover" id="mz-overflow-menu" hidden>
              <button type="button" data-action="settings">Settings</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mz-workspace" id="mz-preview-pane" role="tabpanel">
        <div class="mz-sandbox">
          <span class="mz-sandbox-label">sandbox · click to send a signal</span>
          <canvas id="mz-garden" aria-label="Interactive signal garden preview"></canvas>
        </div>
      </div>

      <div class="mz-workspace" id="mz-code-pane" role="tabpanel" hidden>
        <div class="mz-code-browser">
          <nav class="mz-filetree" aria-label="Files">
            <button type="button" aria-current="true" data-file="App.tsx">App.tsx</button>
            <button type="button" data-file="garden.ts">garden.ts</button>
            <button type="button" data-file="styles.css">styles.css</button>
            <button type="button" data-file="index.html">index.html</button>
            <button type="button" data-file="package.json">package.json</button>
          </nav>
          <div class="mz-editor"><span class="mz-readonly">read only</span><pre id="mz-code"><code></code></pre></div>
        </div>
      </div>
    </section>
  </main>

  <div class="mz-backdrop" id="mz-backdrop" data-action="close-sheet"></div>
  <aside class="mz-sheet" id="mz-version-sheet" aria-label="Version history" aria-hidden="true">
    <div class="mz-sheet-head"><h2>versions</h2><button type="button" class="mz-icon-action" data-action="close-sheet" aria-label="Close versions">×</button></div>
    <div class="mz-version-list">
      <button type="button" class="mz-version" aria-current="true" data-version="Live"><span class="mz-version-dot"></span><span><strong>Live</strong><small>Current live version</small></span></button>
      <button type="button" class="mz-version" aria-current="false" data-version="v4"><span class="mz-version-dot"></span><span><strong>v4 · 2 days ago</strong><small>Tweaked wave rhythm</small></span></button>
      <button type="button" class="mz-version" aria-current="false" data-version="v3"><span class="mz-version-dot"></span><span><strong>v3 · 1 week ago</strong><small>Adjusted bird placement</small></span></button>
      <button type="button" class="mz-version" aria-current="false" data-version="v2"><span class="mz-version-dot"></span><span><strong>v2 · 2 weeks ago</strong><small>Refined plant density</small></span></button>
      <button type="button" class="mz-version" aria-current="false" data-version="v1"><span class="mz-version-dot"></span><span><strong>v1 · 3 weeks ago</strong><small>Initial composition</small></span></button>
    </div>
    <button type="button" class="mz-action" data-version="Live">return to live</button>
  </aside>

  <dialog id="mz-settings-dialog">
    <form method="dialog" id="mz-settings-form">
      <div class="mz-dialog-head"><h2>mezes settings</h2><button type="button" class="mz-icon-action" data-action="close-settings" aria-label="Close settings">×</button></div>
      <div class="mz-dialog-body">
        <div class="mz-field"><label for="mz-name">name</label><input id="mz-name" type="text" value="signal garden" autocomplete="off"></div>
        <fieldset class="mz-field"><legend>privacy</legend><div class="mz-choice-row">
          <label class="mz-choice"><input type="radio" name="privacy" value="private" checked> private</label>
          <label class="mz-choice"><input type="radio" name="privacy" value="public"> public internet</label>
        </div><p class="mz-helper">Public mezedes can be reached by anyone with the link.</p></fieldset>
      </div>
      <div class="mz-dialog-actions">
        <button type="button" class="mz-action mz-action-danger" data-action="delete">delete mezes</button>
        <button type="button" class="mz-action" data-action="close-settings">cancel</button>
        <button type="button" class="mz-action mz-action-primary" data-action="save-settings">save changes</button>
      </div>
    </form>
  </dialog>

  <dialog id="mz-delete-dialog">
    <form method="dialog" id="mz-delete-form">
      <div class="mz-dialog-head"><h2>delete mezes?</h2><button type="button" class="mz-icon-action" data-action="close-delete" aria-label="Close confirmation">×</button></div>
      <div class="mz-dialog-body">
        <p>This removes the mezes and every served version. Type <strong id="mz-delete-name">signal garden</strong> to continue.</p>
        <div class="mz-field"><label for="mz-delete-confirm">mezes name</label><input id="mz-delete-confirm" type="text" autocomplete="off"></div>
      </div>
      <div class="mz-dialog-actions"><button type="button" class="mz-action" data-action="close-delete">cancel</button><button type="button" class="mz-action mz-action-danger" id="mz-confirm-delete" data-action="confirm-delete" disabled>delete forever</button></div>
    </form>
  </dialog>

  <section class="mz-live" id="mz-live-view" aria-label="Public artifact preview" hidden>
    <button type="button" class="mz-live-return" data-action="close-live">← return to mezedes</button>
    <canvas id="mz-live-garden" aria-label="Live signal garden"></canvas>
  </section>
  <div class="mz-toast" id="mz-toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const root = document.getElementById('mezedes-prototype');
      const collectionPage = root.querySelector('#mz-collection-page');
      const detailPage = root.querySelector('#mz-detail-page');
      const crumb = root.querySelector('.mz-crumb');
      const headerName = root.querySelector('#mz-header-name');
      const previewPane = root.querySelector('#mz-preview-pane');
      const codePane = root.querySelector('#mz-code-pane');
      const versionSheet = root.querySelector('#mz-version-sheet');
      const backdrop = root.querySelector('#mz-backdrop');
      const versionButton = root.querySelector('#mz-version-button');
      const settingsDialog = root.querySelector('#mz-settings-dialog');
      const deleteDialog = root.querySelector('#mz-delete-dialog');
      const liveView = root.querySelector('#mz-live-view');
      const toast = root.querySelector('#mz-toast');
      const accountMenu = root.querySelector('#mz-account-menu');
      const overflowMenu = root.querySelector('#mz-overflow-menu');
      const nameInput = root.querySelector('#mz-name');
      const deleteName = root.querySelector('#mz-delete-name');
      const deleteInput = root.querySelector('#mz-delete-confirm');
      const deleteButton = root.querySelector('#mz-confirm-delete');
      const grid = root.querySelector('#mz-grid');
      const count = root.querySelector('#mz-count');
      const codeTarget = root.querySelector('#mz-code code');
      let currentName = 'signal garden';
      let currentVersion = 'Live';
      let toastTimer;

      const codeFiles = {
        'App.tsx': `<span class="tk-o">import</span> { SignalGarden } <span class="tk-o">from</span> <span class="tk-y">'./garden'</span>;

<span class="tk-o">export default function</span> App() {
  <span class="tk-o">return</span> &lt;SignalGarden density={<span class="tk-y">18</span>} /&gt;;
}`,
        'garden.ts': `<span class="tk-o">export function</span> <span class="tk-g">sendSignal</span>(x: number, y: number) {
  <span class="tk-o">return</span> { origin: [x, y], rings: <span class="tk-y">3</span> };
}

<span class="tk-o">export const</span> palette = {
  cobalt: <span class="tk-y">'#174e91'</span>,
  olive: <span class="tk-y">'#65704c'</span>,
  sun: <span class="tk-y">'#d8512d'</span>
};`,
        'styles.css': `.garden { background: <span class="tk-y">#f3eddd</span>; }
.signal { stroke: <span class="tk-y">#d8512d</span>; }
.stem { stroke: <span class="tk-y">#65704c</span>; }`,
        'index.html': `&lt;main id=<span class="tk-y">"garden"</span>&gt;&lt;/main&gt;
&lt;script type=<span class="tk-y">"module"</span> src=<span class="tk-y">"/src/App.tsx"</span>&gt;&lt;/script&gt;`,
        'package.json': `{
  <span class="tk-y">"name"</span>: <span class="tk-y">"signal-garden"</span>,
  <span class="tk-y">"private"</span>: true,
  <span class="tk-y">"dependencies"</span>: { <span class="tk-y">"react"</span>: <span class="tk-y">"19.1.0"</span> }
}`
      };

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-open');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-open'), 2200);
      }

      function closeMenus() {
        accountMenu.hidden = true;
        overflowMenu.hidden = true;
        root.querySelector('[data-action="account"]').setAttribute('aria-expanded', 'false');
        root.querySelector('[data-action="overflow"]').setAttribute('aria-expanded', 'false');
      }

      function goHome() {
        root.dataset.route = 'collection';
        collectionPage.hidden = false;
        detailPage.hidden = true;
        crumb.hidden = true;
        closeSheet();
        closeMenus();
      }

      function openMezes(name) {
        currentName = name;
        root.dataset.route = 'detail';
        collectionPage.hidden = true;
        detailPage.hidden = false;
        crumb.hidden = false;
        headerName.textContent = name;
        nameInput.value = name;
        deleteName.textContent = name;
        setView('preview');
        requestAnimationFrame(() => drawGarden(root.querySelector('#mz-garden'), currentVersion));
      }

      function setView(view) {
        const preview = view === 'preview';
        previewPane.hidden = !preview;
        codePane.hidden = preview;
        root.querySelectorAll('.mz-mode').forEach(button => button.setAttribute('aria-selected', String(button.dataset.view === view)));
        if (!preview) codeTarget.innerHTML = codeFiles['App.tsx'];
      }

      function openSheet() {
        versionSheet.classList.add('is-open');
        backdrop.classList.add('is-open');
        versionSheet.setAttribute('aria-hidden', 'false');
        root.querySelector('[data-action="versions"]').setAttribute('aria-expanded', 'true');
      }

      function closeSheet() {
        versionSheet.classList.remove('is-open');
        backdrop.classList.remove('is-open');
        versionSheet.setAttribute('aria-hidden', 'true');
        const trigger = root.querySelector('[data-action="versions"]');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
      }

      function selectVersion(version) {
        currentVersion = version;
        root.querySelectorAll('.mz-version').forEach(button => button.setAttribute('aria-current', String(button.dataset.version === version)));
        versionButton.textContent = version === 'Live' ? 'versions' : `versions · ${version}`;
        drawGarden(root.querySelector('#mz-garden'), version);
        closeSheet();
        showToast(version === 'Live' ? 'Showing live' : `Showing frozen ${version}`);
      }

      function toggleTheme() {
        const dark = root.dataset.theme === 'dark';
        root.dataset.theme = dark ? 'light' : 'dark';
        const themeButton = root.querySelector('.mz-header [data-action="theme"]');
        themeButton.querySelector('.mz-symbol').textContent = dark ? '☼' : '◐';
        themeButton.querySelector('.mz-label').textContent = dark ? 'daylight' : 'olive dusk';
        themeButton.setAttribute('aria-label', dark ? 'Switch to olive dusk' : 'Switch to Hellenic daylight');
        drawGarden(root.querySelector('#mz-garden'), currentVersion);
        if (!liveView.hidden) drawGarden(root.querySelector('#mz-live-garden'), currentVersion);
        closeMenus();
      }

      function openSettings() {
        closeMenus();
        nameInput.value = currentName;
        settingsDialog.showModal();
      }

      function saveSettings() {
        const nextName = nameInput.value.trim() || currentName;
        const privacy = root.querySelector('input[name="privacy"]:checked').value;
        const oldName = currentName;
        currentName = nextName;
        headerName.textContent = nextName;
        deleteName.textContent = nextName;
        const matchingCard = [...grid.querySelectorAll('.mz-mezes')].find(card => card.dataset.mezes === oldName);
        if (matchingCard) {
          matchingCard.dataset.mezes = nextName;
          matchingCard.querySelector('.mz-mezes-title').innerHTML = nextName.split(' ').join('<br>');
          const meta = matchingCard.querySelector('.mz-meta');
          meta.textContent = `${privacy === 'public' ? 'public' : 'private'} · 4 versions · now`;
        }
        settingsDialog.close();
        showToast('Changes saved');
      }

      function openDelete() {
        settingsDialog.close();
        deleteInput.value = '';
        deleteButton.disabled = true;
        deleteDialog.showModal();
      }

      function confirmDelete() {
        const card = [...grid.querySelectorAll('.mz-mezes')].find(item => item.dataset.mezes === currentName);
        if (card) card.remove();
        count.textContent = `${grid.querySelectorAll('.mz-mezes').length} mezedes`;
        deleteDialog.close();
        goHome();
        showToast('Mezes deleted');
      }

      function openLive() {
        liveView.hidden = false;
        drawGarden(root.querySelector('#mz-live-garden'), currentVersion);
      }

      function drawGarden(canvas, version) {
        if (!canvas || canvas.offsetWidth === 0) return;
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width * ratio));
        canvas.height = Math.max(1, Math.round(rect.height * ratio));
        const ctx = canvas.getContext('2d');
        ctx.scale(ratio, ratio);
        const w = rect.width;
        const h = rect.height;
        const dark = root.dataset.theme === 'dark';
        const paper = dark ? '#111711' : '#fffaf0';
        const cobalt = dark ? '#a6ba75' : '#174e91';
        const olive = dark ? '#8fa269' : '#65704c';
        const accent = dark ? '#d6a846' : '#d8512d';
        const seedBase = {Live: 41, v4: 35, v3: 29, v2: 23, v1: 17}[version] || 41;
        let seed = seedBase;
        const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        ctx.fillStyle = paper;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = cobalt;
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.55;
        for (let wave = 0; wave < 9; wave++) {
          ctx.beginPath();
          for (let x = -20; x <= w + 20; x += 7) {
            const y = h * 0.64 + wave * 8 + Math.sin(x * 0.018 + wave * 0.55) * 14;
            if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        const stems = Math.max(16, Math.floor(w / 44));
        for (let i = 0; i < stems; i++) {
          const x = 18 + random() * (w - 36);
          const stemH = h * (0.2 + random() * 0.42);
          const base = h - 18;
          const bend = (random() - 0.5) * 34;
          ctx.strokeStyle = olive;
          ctx.lineWidth = 1 + random() * 0.6;
          ctx.beginPath();
          ctx.moveTo(x, base);
          ctx.quadraticCurveTo(x + bend * 0.4, base - stemH * 0.55, x + bend, base - stemH);
          ctx.stroke();
          const leaves = 3 + Math.floor(random() * 5);
          for (let leaf = 1; leaf <= leaves; leaf++) {
            const t = leaf / (leaves + 1);
            const lx = x + bend * t;
            const ly = base - stemH * t;
            const side = leaf % 2 ? -1 : 1;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.quadraticCurveTo(lx + side * 14, ly - 10, lx + side * 19, ly - 3);
            ctx.quadraticCurveTo(lx + side * 9, ly + 3, lx, ly);
            ctx.stroke();
          }
          if (random() > 0.36) {
            ctx.fillStyle = random() > 0.7 ? accent : olive;
            ctx.beginPath();
            ctx.arc(x + bend, base - stemH, 2.5 + random() * 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = accent;
        for (let i = 0; i < 13; i++) {
          const x = random() * w;
          const y = 35 + random() * h * 0.4;
          ctx.fillRect(x, y, 2, 2);
        }
        canvas.dataset.drawn = 'true';
      }

      function sendSignal(event) {
        const canvas = event.currentTarget;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const ctx = canvas.getContext('2d');
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        ctx.save();
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = root.dataset.theme === 'dark' ? '#d6a846' : '#d8512d';
        ctx.lineWidth = 1.5;
        [12, 28, 46].forEach(radius => { ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.stroke(); });
        ctx.restore();
      }

      root.addEventListener('click', event => {
        const mezes = event.target.closest('[data-mezes]');
        if (mezes) { openMezes(mezes.dataset.mezes); return; }
        const view = event.target.closest('[data-view]');
        if (view) { setView(view.dataset.view); return; }
        const version = event.target.closest('[data-version]');
        if (version) { selectVersion(version.dataset.version); return; }
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (!action) return;
        if (action === 'home') goHome();
        if (action === 'theme') toggleTheme();
        if (action === 'account') { const open = accountMenu.hidden; closeMenus(); accountMenu.hidden = !open; event.target.closest('button').setAttribute('aria-expanded', String(open)); }
        if (action === 'overflow') { const open = overflowMenu.hidden; closeMenus(); overflowMenu.hidden = !open; event.target.closest('button').setAttribute('aria-expanded', String(open)); }
        if (action === 'versions') openSheet();
        if (action === 'close-sheet') closeSheet();
        if (action === 'settings') openSettings();
        if (action === 'save-settings') saveSettings();
        if (action === 'close-settings') settingsDialog.close();
        if (action === 'delete') openDelete();
        if (action === 'confirm-delete') confirmDelete();
        if (action === 'close-delete') deleteDialog.close();
        if (action === 'open-live') openLive();
        if (action === 'close-live') liveView.hidden = true;
        if (action === 'signout') { closeMenus(); showToast('Signed out in the real product'); }
      });

      deleteInput.addEventListener('input', () => { deleteButton.disabled = deleteInput.value !== currentName; });
      root.querySelectorAll('[data-file]').forEach(button => button.addEventListener('click', () => {
        root.querySelectorAll('[data-file]').forEach(item => item.setAttribute('aria-current', String(item === button)));
        codeTarget.innerHTML = codeFiles[button.dataset.file];
      }));
      root.querySelector('#mz-garden').addEventListener('click', sendSignal);
      root.querySelector('#mz-live-garden').addEventListener('click', sendSignal);
      window.addEventListener('resize', () => {
        if (root.dataset.route === 'detail' && !previewPane.hidden) drawGarden(root.querySelector('#mz-garden'), currentVersion);
        if (!liveView.hidden) drawGarden(root.querySelector('#mz-live-garden'), currentVersion);
      });

      codeTarget.innerHTML = codeFiles['App.tsx'];
    })();
  </script>
</div>

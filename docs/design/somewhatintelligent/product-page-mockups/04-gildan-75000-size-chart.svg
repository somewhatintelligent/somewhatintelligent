<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 5 L 10 0 L 10 10 Z" fill="#08090a"/>
    </marker>
    <style>
      .display { font-family: "Barlow Condensed", sans-serif; font-weight: 900; }
      .mono { font-family: "Iosevka", monospace; }
      .rule { stroke: #08090a; stroke-width: 2; fill: none; }
      .hairline { stroke: #08090a; stroke-width: 1.25; fill: none; }
      .label { font-family: "Iosevka", monospace; font-size: 22px; letter-spacing: 1.5px; fill: #08090a; }
      .value { font-family: "Iosevka", monospace; font-size: 28px; fill: #08090a; }
    </style>
  </defs>

  <g fill="#08090a">
    <text x="64" y="92" class="display" font-size="72" letter-spacing="-1">SIZE &amp; FIT</text>
    <text x="64" y="130" class="mono" font-size="22" letter-spacing="2">FINISHED GARMENT / MEASURED FLAT / CENTIMETRES AND INCHES</text>
  </g>

  <line x1="64" y1="164" x2="1536" y2="164" class="rule"/>

  <g aria-label="T-shirt measurement diagram">
    <!--
      ISOTROPIC, AND SOLVED FROM THE THREE PUBLISHED MEASUREMENTS. 13 units per
      inch in BOTH directions, for a medium: chest 21 in, length 29 in, sleeve
      18.5 in from centre back. Verified: 20.9 / 29.0 / 18.5.

      Two errors preceded this, both worth naming so they are not repeated.

      The drawing was stretched ~49% vertically, because its scale came from the
      body box — underarm to hem — while length B is measured from the HIGH
      POINT OF THE SHOULDER, 150 units further up.

      Then the sleeve was built with C ending at the MIDDLE of the hem, and the
      hem's outer corner was allowed to run past it. That put the widest point
      of the garment (19.6 in from centre) beyond the measurement that is
      supposed to reach it (18.5 in) — impossible, and it drew the sleeve as a
      near-horizontal wing. C ends at the hem's OUTER CORNER, which is the
      widest point, so the sleeve drops 25 degrees and the flat comes out at
      35.5 in across against 29 in of length.
    -->
    <path class="rule" d="M 194 308
      L 276 270
      L 380 250
      C 396 296 454 296 470 250
      L 574 270
      L 656 308
      L 612 402
      L 561 415
      L 561 627
      L 289 627
      L 289 415
      L 238 402 Z"/>
    <!-- wide rib collar, set just inside the neckline -->
    <path class="hairline" d="M 386 258 C 400 298 450 298 464 258"/>
    <!-- shoulder seams, dropped -->
    <path class="hairline" d="M 276 270 L 289 415 M 574 270 L 561 415" opacity="0.45"/>
    <!-- hem band -->
    <path class="hairline" d="M 289 596 L 561 596"/>

    <!-- A: taken 1 in (13 units) below the armhole, as the caption promises. -->
    <path class="hairline" d="M 289 415 L 289 441 M 561 415 L 561 441" stroke-dasharray="4 5"/>
    <line x1="291" y1="428" x2="559" y2="428" class="rule" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="425" y="466" text-anchor="middle" class="mono" font-size="24" font-weight="700">A</text>

    <!-- B: high point of shoulder to finished hem, set outside the silhouette. -->
    <path class="hairline" d="M 470 250 L 728 250 M 561 627 L 728 627" stroke-dasharray="4 5"/>
    <line x1="714" y1="250" x2="714" y2="627" class="rule" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="738" y="445" class="mono" font-size="24" font-weight="700">B</text>

    <!-- C: centre back neck, over the shoulder, to the sleeve hem. -->
    <path class="hairline" d="M 425 250 L 276 270 L 194 308" stroke-dasharray="5 5" opacity="0.8"/>
    <circle cx="425" cy="250" r="4.5" fill="#08090a"/>
    <circle cx="194" cy="308" r="4.5" fill="#08090a"/>
    <text x="300" y="238" text-anchor="middle" class="mono" font-size="24" font-weight="700">C</text>

    <text x="425" y="712" text-anchor="middle" class="label">A / CHEST WIDTH</text>
    <text x="425" y="742" text-anchor="middle" class="mono" font-size="17" fill="#08090a">MEASURED 1 IN / 2.5 CM BELOW ARMHOLE</text>
    <text x="425" y="778" text-anchor="middle" class="label">B / BODY LENGTH</text>
    <text x="425" y="808" text-anchor="middle" class="mono" font-size="17" fill="#08090a">HIGH-POINT SHOULDER TO FINISHED HEM</text>
    <text x="425" y="844" text-anchor="middle" class="label">C / SLEEVE LENGTH</text>
    <text x="425" y="874" text-anchor="middle" class="mono" font-size="17" fill="#08090a">CENTRE BACK NECK, OVER SHOULDER, TO HEM</text>
  </g>

  <g aria-label="Size measurements table">
    <text x="760" y="238" class="label">FINISHED GARMENT / CM, INCHES BELOW</text>

    <line x1="760" y1="272" x2="1536" y2="272" class="rule"/>
    <line x1="760" y1="354" x2="1536" y2="354" class="hairline"/>
    <line x1="760" y1="466" x2="1536" y2="466" class="hairline"/>
    <line x1="760" y1="578" x2="1536" y2="578" class="hairline"/>
    <line x1="760" y1="690" x2="1536" y2="690" class="rule"/>
    <line x1="870" y1="272" x2="870" y2="690" class="hairline"/>
    <line x1="1035" y1="272" x2="1035" y2="690" class="hairline"/>
    <line x1="1200" y1="272" x2="1200" y2="690" class="hairline"/>
    <line x1="1365" y1="272" x2="1365" y2="690" class="hairline"/>

    <text x="784" y="322" text-anchor="start" class="mono" font-size="17" fill="#08090a">SIZE</text>
    <text x="952" y="322" text-anchor="middle" class="mono" font-size="17" fill="#08090a">TO FIT CHEST</text>
    <text x="1117" y="322" text-anchor="middle" class="mono" font-size="17" fill="#08090a">A / CHEST</text>
    <text x="1282" y="322" text-anchor="middle" class="mono" font-size="17" fill="#08090a">B / LENGTH</text>
    <text x="1450" y="322" text-anchor="middle" class="mono" font-size="17" fill="#08090a">C / SLEEVE</text>

    <text x="784" y="425" class="display" font-size="54">S</text>
    <text x="952" y="417" text-anchor="middle" class="value" font-size="26">86-91</text>
    <text x="952" y="443" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">34-36 in</text>
    <text x="1117" y="417" text-anchor="middle" class="value" font-size="26">49.5</text>
    <text x="1117" y="443" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">19.5 in</text>
    <text x="1282" y="417" text-anchor="middle" class="value" font-size="26">71.1</text>
    <text x="1282" y="443" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">28 in</text>
    <text x="1450" y="417" text-anchor="middle" class="value" font-size="26">45.1</text>
    <text x="1450" y="443" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">17.75 in</text>

    <text x="784" y="537" class="display" font-size="54">M</text>
    <text x="952" y="529" text-anchor="middle" class="value" font-size="26">97-102</text>
    <text x="952" y="555" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">38-40 in</text>
    <text x="1117" y="529" text-anchor="middle" class="value" font-size="26">53.3</text>
    <text x="1117" y="555" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">21 in</text>
    <text x="1282" y="529" text-anchor="middle" class="value" font-size="26">73.7</text>
    <text x="1282" y="555" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">29 in</text>
    <text x="1450" y="529" text-anchor="middle" class="value" font-size="26">47.0</text>
    <text x="1450" y="555" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">18.5 in</text>

    <text x="784" y="649" class="display" font-size="54">L</text>
    <text x="952" y="641" text-anchor="middle" class="value" font-size="26">107-112</text>
    <text x="952" y="667" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">42-44 in</text>
    <text x="1117" y="641" text-anchor="middle" class="value" font-size="26">58.4</text>
    <text x="1117" y="667" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">23 in</text>
    <text x="1282" y="641" text-anchor="middle" class="value" font-size="26">76.2</text>
    <text x="1282" y="667" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">30 in</text>
    <text x="1450" y="641" text-anchor="middle" class="value" font-size="26">49.5</text>
    <text x="1450" y="667" text-anchor="middle" class="mono" font-size="16" fill="#08090a" opacity="0.62">19.5 in</text>

    <text x="760" y="742" class="label">BOXY, OVERSIZED FIT / DROPPED SHOULDER</text>
    <text x="760" y="778" class="mono" font-size="20" fill="#08090a">100% RING-SPUN COTTON / 241 GSM</text>
    <text x="760" y="812" class="mono" font-size="17" fill="#08090a">C / CENTRE BACK NECK, OVER THE SHOULDER, TO SLEEVE HEM.</text>
    <text x="760" y="838" class="mono" font-size="17" fill="#08090a">TO FIT CHEST IS THE BODY IT IS CUT FOR, NOT THE GARMENT.</text>
    <text x="760" y="864" class="mono" font-size="17" fill="#08090a">MEASURE A SHIRT YOU OWN AND COMPARE. TOLERANCE 2.5 CM.</text>
  </g>
</svg>
